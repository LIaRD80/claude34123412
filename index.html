<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музыкальный плеер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .player {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            min-width: 320px;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        button {
            background: white;
            color: #764ba2;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 80px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .play-btn {
            background: #ff6b9d;
            color: white;
            font-size: 20px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            padding: 0;
        }

        .track-info {
            color: white;
            margin-bottom: 20px;
        }

        .track-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .track-status {
            font-size: 14px;
            opacity: 0.8;
        }

        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
            margin-top: 15px;
        }

        input[type="range"] {
            width: 150px;
            cursor: pointer;
        }

        .track-list {
            margin-top: 20px;
            text-align: left;
        }

        .track-item {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .track-item:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .track-item.active {
            background: rgba(255, 107, 157, 0.6);
        }
    </style>
</head>
<body>
    <div class="player">
        <h1>🎵 Музыкальный плеер</h1>

        <div class="track-info">
            <div class="track-name" id="trackName">Выберите трек</div>
            <div class="track-status" id="status">Готов к воспроизведению</div>
        </div>

        <div class="controls">
            <button id="prevBtn" title="Предыдущий">⏮</button>
            <button class="play-btn" id="playBtn" title="Играть/Пауза">▶</button>
            <button id="nextBtn" title="Следующий">⏭</button>
        </div>

        <div class="volume-control">
            <span>🔊</span>
            <input type="range" id="volume" min="0" max="100" value="50">
            <span id="volumeValue">50%</span>
        </div>

        <div class="track-list" id="trackList"></div>
    </div>

    <script>
        const tracks = [
            { name: "До мажор (C)", frequency: 261.63 },
            { name: "Ре (D)", frequency: 293.66 },
            { name: "Ми (E)", frequency: 329.63 },
            { name: "Фа (F)", frequency: 349.23 },
            { name: "Соль (G)", frequency: 392.00 },
            { name: "Ля (A)", frequency: 440.00 },
            { name: "Си (B)", frequency: 493.88 }
        ];

        const melody = [
            { note: 0, duration: 0.4 },
            { note: 2, duration: 0.4 },
            { note: 4, duration: 0.4 },
            { note: 5, duration: 0.4 },
            { note: 4, duration: 0.4 },
            { note: 2, duration: 0.4 },
            { note: 0, duration: 0.8 },
            { note: 4, duration: 0.4 },
            { note: 5, duration: 0.4 },
            { note: 6, duration: 0.4 },
            { note: 5, duration: 0.4 },
            { note: 4, duration: 0.8 }
        ];

        let audioCtx = null;
        let currentTrackIndex = 0;
        let isPlaying = false;
        let currentOscillator = null;
        let melodyTimeout = null;
        let melodyIndex = 0;
        let volume = 0.5;

        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const trackName = document.getElementById('trackName');
        const status = document.getElementById('status');
        const volumeSlider = document.getElementById('volume');
        const volumeValue = document.getElementById('volumeValue');
        const trackList = document.getElementById('trackList');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function renderTrackList() {
            trackList.innerHTML = '';
            const allOption = document.createElement('div');
            allOption.className = 'track-item' + (currentTrackIndex === -1 ? ' active' : '');
            allOption.textContent = '🎼 Мелодия "Ода радости"';
            allOption.onclick = () => selectTrack(-1);
            trackList.appendChild(allOption);

            tracks.forEach((track, i) => {
                const item = document.createElement('div');
                item.className = 'track-item' + (i === currentTrackIndex ? ' active' : '');
                item.textContent = `🎹 ${track.name}`;
                item.onclick = () => selectTrack(i);
                trackList.appendChild(item);
            });
        }

        function selectTrack(index) {
            stopSound();
            currentTrackIndex = index;
            if (index === -1) {
                trackName.textContent = 'Ода радости (Бетховен)';
            } else {
                trackName.textContent = tracks[index].name;
            }
            status.textContent = 'Готов к воспроизведению';
            renderTrackList();
        }

        function playNote(frequency, duration) {
            initAudio();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.value = frequency;

            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.02);
            gainNode.gain.linearRampToValueAtTime(volume * 0.7, audioCtx.currentTime + duration * 0.7);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);

            return oscillator;
        }

        function playMelody() {
            if (!isPlaying) return;
            if (melodyIndex >= melody.length) {
                melodyIndex = 0;
            }
            const step = melody[melodyIndex];
            const track = tracks[step.note];
            status.textContent = `▶ Играет: ${track.name}`;
            playNote(track.frequency, step.duration);
            melodyIndex++;
            melodyTimeout = setTimeout(playMelody, step.duration * 1000);
        }

        function playSingleNote() {
            if (!isPlaying) return;
            const track = tracks[currentTrackIndex];
            playNote(track.frequency, 0.5);
            melodyTimeout = setTimeout(playSingleNote, 600);
        }

        function startSound() {
            isPlaying = true;
            playBtn.textContent = '⏸';
            if (currentTrackIndex === -1) {
                melodyIndex = 0;
                playMelody();
            } else {
                status.textContent = `▶ Играет: ${tracks[currentTrackIndex].name}`;
                playSingleNote();
            }
        }

        function stopSound() {
            isPlaying = false;
            playBtn.textContent = '▶';
            if (melodyTimeout) {
                clearTimeout(melodyTimeout);
                melodyTimeout = null;
            }
            status.textContent = 'Пауза';
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                stopSound();
            } else {
                startSound();
            }
        });

        prevBtn.addEventListener('click', () => {
            let newIndex;
            if (currentTrackIndex === -1) {
                newIndex = tracks.length - 1;
            } else if (currentTrackIndex === 0) {
                newIndex = -1;
            } else {
                newIndex = currentTrackIndex - 1;
            }
            const wasPlaying = isPlaying;
            selectTrack(newIndex);
            if (wasPlaying) startSound();
        });

        nextBtn.addEventListener('click', () => {
            let newIndex;
            if (currentTrackIndex === -1) {
                newIndex = 0;
            } else if (currentTrackIndex === tracks.length - 1) {
                newIndex = -1;
            } else {
                newIndex = currentTrackIndex + 1;
            }
            const wasPlaying = isPlaying;
            selectTrack(newIndex);
            if (wasPlaying) startSound();
        });

        volumeSlider.addEventListener('input', (e) => {
            volume = e.target.value / 100;
            volumeValue.textContent = e.target.value + '%';
        });

        selectTrack(-1);
    </script>
</body>
</html>
